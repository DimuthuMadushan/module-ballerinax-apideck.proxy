openapi: 3.0.3
info:
  version: 10.62.0
  title: Proxy API
  description: The Apideck Proxy API forwards a request to the API of a downstream connector through Apideck Unify and returns the downstream response. Apideck injects the credentials stored for the consumer in Vault, so the caller only supplies its Apideck API key and application ID, the consumer and service to use, and the downstream URL.
  contact:
    email: hello@apideck.com
    url: https://developers.apideck.com
  x-logo:
    url: https://developers.apideck.com/icon.png
  x-apideck-api: proxy
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
externalDocs:
  description: Apideck Developer Docs
  url: https://developers.apideck.com
servers:
  - url: https://unify.apideck.com
    description: Production server
tags:
  - name: Execute
    description: Execute enables pass-through requests to downstream APIs with automatic authentication injection from Vault credentials.
components:
  parameters:
    id:
      in: path
      name: id
      schema:
        type: string
      required: true
      description: ID of the record you are acting upon.
    x-apideck-app-id:
      name: x-apideck-app-id
      in: header
      required: true
      description: The ID of your Unify application
      schema:
        type: string
        minLength: 1
      example: dSBdXd2H6Mqwfg0atXHXYcysLJE9qyn1VwBtXHX
      x-speakeasy-name-override: appId
    x-apideck-consumer-id:
      name: x-apideck-consumer-id
      in: header
      required: true
      description: ID of the consumer which you want to get or push data from
      schema:
        type: string
      example: test-consumer
      x-speakeasy-name-override: consumerId
    x-apideck-service-id:
      name: x-apideck-service-id
      in: header
      required: true
      description: Provide the service id you want to call (e.g., pipedrive). Only needed when a consumer has activated multiple integrations for a Unified API.
      example: close
      schema:
        type: string
      x-speakeasy-name-override: serviceId
    x-apideck-unified-api:
      name: x-apideck-unified-api
      in: header
      required: false
      description: Specify which unified API to use for the connection lookup. Required for multi-API connectors (e.g., Workday) to ensure the correct credentials are used.
      example: hris
      schema:
        type: string
      x-speakeasy-name-override: unifiedApi
    x-apideck-downstream-url:
      name: x-apideck-downstream-url
      in: header
      description: Downstream URL
      example: https://api.close.com/api/v1/lead
      required: true
      schema:
        type: string
      x-speakeasy-name-override: downstreamUrl
    x-apideck-downstream-method:
      name: x-apideck-downstream-method
      in: header
      description: Downstream method. If not provided the upstream method will be inherited,
      example: GET
      required: false
      schema:
        type: string
    x-apideck-downstream-authorization:
      name: x-apideck-downstream-authorization
      in: header
      description: Downstream authorization header. This will skip the Vault token injection.
      example: Bearer <token>
      required: false
      schema:
        type: string
      x-speakeasy-name-override: downstreamAuthorization
    x-apideck-timeout:
      name: x-apideck-timeout
      in: header
      description: Override the default downstream request timeout in milliseconds. The default is 28000 (28 seconds).
      example: 30000
      required: false
      schema:
        type: integer
        default: 28000
      x-speakeasy-name-override: timeout
    x-apideck-follow-redirects:
      name: x-apideck-follow-redirects
      in: header
      description: Set to `false` to opt out of the redirect to the presigned download URL. Instead of a `30x` response, you receive a `200` JSON body `{ url, expires_at }` containing the URL and its expiry, which you can fetch explicitly. Use this if your client automatically forwards the `Authorization` header onto redirects, since the downstream storage provider will reject that request. Any value other than `false` (or omitting the header) preserves the default redirect behavior.
      schema:
        type: boolean
        default: true
      example: false
      x-speakeasy-name-override: followRedirects
    raw:
      name: raw
      in: query
      description: Include raw response. Mostly used for debugging purposes
      schema:
        type: boolean
        default: false
  schemas:
    ProxyRequestBody:
      description: Request body forwarded to the downstream service. It can be a JSON object, a plain string, or an array of JSON objects.
      anyOf:
        - type: object
          description: JSON object forwarded as the request body
          properties: {}
          example:
            name: Bluth Company
            url: http://thebluthcompany.tumblr.com/
            description: Best. Show. Ever.
        - type: string
          description: Plain string forwarded as the request body
        - type: array
          description: Array of JSON objects forwarded as the request body
          items:
            type: object
            properties: {}
  responses:
    Unauthorized:
      description: Unauthorized. The Apideck API key or application ID is missing or invalid
      content:
        application/json:
          schema:
            type: object
            x-apideck-schema-id: Unauthorized
            properties:
              status_code:
                type: number
                description: HTTP status code
                example: 401
              error:
                type: string
                description: Contains an explanation of the status_code as defined in HTTP/1.1 standard (RFC 7231)
                example: Unauthorized
              type_name:
                type: string
                description: The type of error returned
                example: UnauthorizedError
              message:
                type: string
                description: A human-readable message providing more details about the error.
                example: Unauthorized Request
                x-speakeasy-error-message: true
              detail:
                anyOf:
                  - type: string
                    example: Missing authentication
                  - type: object
                    x-speakeasy-detail: true
                    properties:
                      type:
                        type: string
                        description: Error type identifier
                        example: refresh_token_connector_error
                      message:
                        type: string
                        description: Detailed error message
                        example: Token refresh failed
                      debug:
                        type: object
                        description: Debug information including request/response details and OAuth timing metadata
                        properties:
                          request:
                            type: object
                            description: HTTP request details
                          response:
                            type: object
                            description: HTTP response details
                          message:
                            type: string
                            description: Error message from downstream provider or network layer
                          code:
                            type: string
                            description: Error code (e.g., ETIMEDOUT, ECONNREFUSED)
                          credentials_expire_at_ms:
                            type: number
                            description: Unix timestamp (milliseconds) when credentials will be deleted if not refreshed. Only present for non-recoverable errors (401, 400). Credentials are preserved indefinitely for recoverable/network errors.
                            example: 1620172800000
                          retry_after_ms:
                            type: number
                            description: Unix timestamp (milliseconds) when token refresh retry is allowed after cooldown period expires.
                            example: 1620000030000
                          cooldown_remaining_ms:
                            type: number
                            description: Milliseconds remaining in cooldown period before retry is allowed.
                            example: 30000
                    example:
                      type: refresh_token_connector_error
                      message: Token refresh failed with 401 error
                      debug:
                        response:
                          statusCode: 401
                          data:
                            error: invalid_grant
                        credentials_expire_at_ms: 1620172800000
                        retry_after_ms: 1620000030000
                        cooldown_remaining_ms: 30000
                description: Contains parameter or domain specific information related to the error and why it occurred.
              ref:
                type: string
                description: Link to documentation of error type
                example: https://developers.apideck.com/errors#unauthorizederror
    ProxyError:
      description: Proxy error. The request could not be forwarded, or the downstream service returned an error, which is indicated by the x-apideck-downstream-error header
      headers:
        x-apideck-downstream-error:
          schema:
            type: boolean
            description: Indicates if the error returned in the body is from the downstream
      content:
        application/json:
          schema:
            x-speakeasy-name-override: errorJson
            type: object
            additionalProperties: true
        application/xml:
          schema:
            x-speakeasy-name-override: errorXml
            type: string
        text/plain:
          schema:
            x-speakeasy-name-override: errorText
            type: string
        text/html:
          schema:
            x-speakeasy-name-override: errorHtml
            type: string
    Ok:
      description: "Response of the downstream service to the proxied request, returned as JSON, XML, plain text or CSV depending on what the downstream service sends. When `x-apideck-follow-redirects` is `false` and the downstream response would redirect to a presigned URL, a JSON object with `url` and `expires_at` is returned instead"
      content:
        application/json:
          schema:
            x-speakeasy-name-override: responseJson
            type: object
            additionalProperties: true
        application/xml:
          schema:
            x-speakeasy-name-override: responseXml
            type: string
        text/plain:
          schema:
            x-speakeasy-name-override: responseText
            type: string
        text/csv:
          schema:
            x-speakeasy-name-override: responseCsv
            type: string
        application/pdf:
          schema:
            x-speakeasy-name-override: responsePdf
            type: string
            format: binary
        application/octet-stream:
          schema:
            x-speakeasy-name-override: responseBinary
            type: string
            format: binary
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: Authorization
      description: |
        To access our API, you need to sign up and obtain your unique API key. Each Unify application is assigned a single API key. You can locate your API key in the Configuration Settings section of your Apideck application. Additionally, your application’s application_id is available on the same page.

        Authenticate your API requests by including your test or live secret API key in the request header.

        - Bearer authorization header: `Authorization: Bearer "YOUR_API_KEY_HERE"`
        - Application id header: `x-apideck-app-id: "YOUR_APP_ID_HERE"`

        You should use the public keys on the SDKs and the secret keys to authenticate API requests.

        **Do not share or include your secret API keys on client side code.** Your API keys carry significant privileges. Please ensure to keep them 100% secure and be sure to not share your secret API keys in areas that are publicly accessible like GitHub.

        Learn how to set the Authorization header inside Postman https://learning.postman.com/docs/postman/sending-api-requests/authorization/#api-key

        Go to Unify to grab your API KEY https://app.apideck.com/unify/api-keys
    applicationId:
      type: apiKey
      in: header
      name: x-apideck-app-id
      description: The ID of your Unify application
security:
  - apiKey: []
    applicationId: []
paths:
  /proxy:
    get:
      summary: Proxy a downstream GET request
      operationId: proxyGet
      x-apideck-api: proxy
      description: |
        Proxies a downstream GET request to a service and injects the necessary credentials into a request stored in Vault. This allows you to have an additional security layer and logging without needing to rely on Unify for normalization.
        **Note**: Vault will proxy all data to the downstream URL and method/verb in the headers.
        Send the `x-apideck-consumer-id`, `x-apideck-downstream-url` and, where needed, `x-apideck-service-id`, `x-apideck-unified-api`, `x-apideck-downstream-authorization`, `x-apideck-timeout` and `x-apideck-follow-redirects` headers through the `headers` map.
      tags:
        - Execute
      security:
        - apiKey: []
          applicationId: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ProxyError'
    options:
      summary: Proxy a downstream OPTIONS request
      operationId: proxyOptions
      x-apideck-api: proxy
      description: |
        Proxies a downstream OPTION request to a service and injects the necessary credentials into a request stored in Vault. This allows you to have an additional security layer and logging without needing to rely on Unify for normalization.
        **Note**: Vault will proxy all data to the downstream URL and method/verb in the headers.
        Send the `x-apideck-consumer-id`, `x-apideck-downstream-url` and, where needed, `x-apideck-service-id`, `x-apideck-unified-api`, `x-apideck-downstream-authorization`, `x-apideck-timeout` and `x-apideck-follow-redirects` headers through the `headers` map.
      tags:
        - Execute
      security:
        - apiKey: []
          applicationId: []
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ProxyError'
    post:
      summary: Proxy a downstream POST request
      operationId: proxyPost
      x-apideck-api: proxy
      description: |
        Proxies a downstream POST request to a service and injects the necessary credentials into a request stored in Vault. This allows you to have an additional security layer and logging without needing to rely on Unify for normalization.
        **Note**: Vault will proxy all data to the downstream URL and method/verb in the headers.
        Send the `x-apideck-consumer-id`, `x-apideck-downstream-url` and, where needed, `x-apideck-service-id`, `x-apideck-unified-api`, `x-apideck-downstream-authorization`, `x-apideck-timeout` and `x-apideck-follow-redirects` headers through the `headers` map.
      tags:
        - Execute
      security:
        - apiKey: []
          applicationId: []
      requestBody:
        description: Depending on the verb/method of the request this will contain the request body you want to POST/PATCH/PUT.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ProxyError'
    put:
      summary: Proxy a downstream PUT request
      operationId: proxyPut
      x-apideck-api: proxy
      description: |
        Proxies a downstream PUT request to a service and injects the necessary credentials into a request stored in Vault. This allows you to have an additional security layer and logging without needing to rely on Unify for normalization.
        **Note**: Vault will proxy all data to the downstream URL and method/verb in the headers.
        Send the `x-apideck-consumer-id`, `x-apideck-downstream-url` and, where needed, `x-apideck-service-id`, `x-apideck-unified-api`, `x-apideck-downstream-authorization`, `x-apideck-timeout` and `x-apideck-follow-redirects` headers through the `headers` map.
      tags:
        - Execute
      security:
        - apiKey: []
          applicationId: []
      requestBody:
        description: Depending on the verb/method of the request this will contain the request body you want to POST/PATCH/PUT.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ProxyError'
    patch:
      summary: Proxy a downstream PATCH request
      operationId: proxyPatch
      x-apideck-api: proxy
      description: |
        Proxies a downstream PATCH request to a service and injects the necessary credentials into a request stored in Vault. This allows you to have an additional security layer and logging without needing to rely on Unify for normalization.
        **Note**: Vault will proxy all data to the downstream URL and method/verb in the headers.
        Send the `x-apideck-consumer-id`, `x-apideck-downstream-url` and, where needed, `x-apideck-service-id`, `x-apideck-unified-api`, `x-apideck-downstream-authorization`, `x-apideck-timeout` and `x-apideck-follow-redirects` headers through the `headers` map.
      tags:
        - Execute
      security:
        - apiKey: []
          applicationId: []
      requestBody:
        description: Depending on the verb/method of the request this will contain the request body you want to POST/PATCH/PUT.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProxyRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ProxyError'
    delete:
      summary: Proxy a downstream DELETE request
      operationId: proxyDelete
      x-apideck-api: proxy
      description: |
        Proxies a downstream DELETE request to a service and injects the necessary credentials into a request stored in Vault. This allows you to have an additional security layer and logging without needing to rely on Unify for normalization.
        **Note**: Vault will proxy all data to the downstream URL and method/verb in the headers.
        Send the `x-apideck-consumer-id`, `x-apideck-downstream-url` and, where needed, `x-apideck-service-id`, `x-apideck-unified-api`, `x-apideck-downstream-authorization`, `x-apideck-timeout` and `x-apideck-follow-redirects` headers through the `headers` map.
      tags:
